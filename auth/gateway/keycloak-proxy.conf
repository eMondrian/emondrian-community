# Proxy settings towards Keycloak (included by emondrian-locations.conf)
proxy_set_header Host              $http_host;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Host with the published port; no X-Forwarded-Port, which would be the container's own port
proxy_set_header X-Forwarded-Host  $http_host;
proxy_set_header X-Forwarded-User   "";
proxy_set_header X-Forwarded-Groups "";
# Keycloak's responses carry large cookies and headers
proxy_buffer_size       128k;
proxy_buffers           4 256k;
proxy_busy_buffers_size 256k;
