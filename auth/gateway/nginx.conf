# eMondrian auth gateway: the only published port of the stack when docker-compose.auth.yml is used.
# Every request except Keycloak's own pages is authenticated here; the caller's identity is then
# passed on as X-Forwarded-User / X-Forwarded-Groups, which this gateway always overwrites.
# The server blocks (HTTP or HTTPS) are written by docker-entrypoint.sh; the locations are in
# emondrian-locations.conf.

worker_processes auto;
error_log /dev/stderr notice;

# Settings read by lua/emondrian/config.lua (see docker-compose.auth.yml)
env PUBLIC_URL;
env KEYCLOAK_INTERNAL_URL;
env KEYCLOAK_REALM;
env OIDC_CLIENT_ID;
env OIDC_CLIENT_SECRET;
env OIDC_AUDIENCE;
env SESSION_SECRET;
env AUTH_BASIC;
env AUTH_BEARER;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # Audit: who made each request, as the gateway forwarded it to eMondrian
    log_format audit '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                     'user="$auth_user" groups="$auth_groups" method="$auth_method" '
                     '"$http_user_agent" ${request_time}s';
    access_log /dev/stdout audit;

    # Docker's resolver, for keycloak / emondrian_entry looked up from Lua
    resolver 127.0.0.11 ipv6=off valid=30s;

    lua_package_path "/etc/nginx/lua/?.lua;;";

    # Certificate checks for HTTPS requests made from Lua (identity provider in mode oidc-direct)
    lua_ssl_trusted_certificate /etc/nginx/generated/ca-bundle.pem;
    lua_ssl_verify_depth 5;

    # lua-resty-openidc caches
    lua_shared_dict discovery         1m;
    lua_shared_dict jwks              1m;
    lua_shared_dict jwt_verification  10m;
    # Browser sessions (tokens stay server-side, the cookie only carries the session id)
    lua_shared_dict sessions          20m;
    # Basic credentials already checked, keyed by a hash of user and password
    lua_shared_dict basic_auth        10m;

    init_by_lua_block {
        require("emondrian.gateway").init()
    }

    # X-Accel-Buffering for a proxy in front: "no" on MCP (SSE), absent elsewhere
    map $uri $mcp_accel_buffering {
        ~^/emondrian/mcp  no;
        default           "";
    }

    # GATEWAY_REAL_IP_FROM: the client address from X-Forwarded-For of the proxies named there
    include /etc/nginx/generated/real-ip.conf;
    include /etc/nginx/generated/servers.conf;
}
