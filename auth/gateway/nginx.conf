# eMondrian auth gateway: the only published port of the stack when docker-compose.auth.yml is used.
# Every request except Keycloak's own pages is authenticated here; the caller's identity is then
# passed on as X-Forwarded-User / X-Forwarded-Groups / X-Forwarded-Access-Token (the user's token
# of the identity provider, when the login produced one), and X-Forwarded-Client: mcp on the MCP
# endpoint; the gateway always overwrites all four.
# The server blocks (HTTP or HTTPS) are written by docker-entrypoint.sh; the locations are in
# emondrian-locations.conf.

worker_processes auto;
error_log /dev/stderr notice;

# Settings read by lua/emondrian/config.lua (see docker-compose.auth.yml)
env PUBLIC_URL;
env KEYCLOAK_INTERNAL_URL;
env KEYCLOAK_REALM;
env OIDC_CLIENT_ID;
env OIDC_CLIENT_SECRET;
env OIDC_AUDIENCE;
env SESSION_SECRET;
env AUTH_BASIC;
env AUTH_BEARER;
env AUTH_TOKEN_LEEWAY;
env EMONDRIAN_FORWARDED_SECRET;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;
    # Request headers up to 32 KB per line (default 8 KB): a Bearer token of a user in many groups.
    # eMondrian accepts 32 KB of headers in all (server image 10.0.91 and later), the limit that counts.
    large_client_header_buffers 4 32k;

    # Audit: who made each request, as the gateway forwarded it to eMondrian
    # A personal token in the address (?emondrian_token=…) is masked: the request line is logged as it
    # arrived, before the gateway removes the parameter
    map $request $request_masked {
        "~^(?<head>.*[?&]emondrian_token=)[^&\s]*(?<tail>.*)$"  "${head}***${tail}";
        default                                                  $request;
    }
    log_format audit '$remote_addr [$time_local] "$request_masked" $status $body_bytes_sent '
                     'user="$auth_user" groups="$auth_groups" method="$auth_method" client="$auth_client" '
                     '"$http_user_agent" ${request_time}s';
    access_log /dev/stdout audit;

    # Docker's resolver, for keycloak / emondrian_entry looked up from Lua
    resolver 127.0.0.11 ipv6=off valid=30s;

    lua_package_path "/etc/nginx/lua/?.lua;;";

    # Certificate checks for HTTPS requests made from Lua (identity provider in mode oidc-direct)
    lua_ssl_trusted_certificate /etc/nginx/generated/ca-bundle.pem;
    lua_ssl_verify_depth 5;

    # lua-resty-openidc caches
    lua_shared_dict discovery         1m;
    lua_shared_dict jwks              1m;
    lua_shared_dict jwt_verification  10m;
    # Browser sessions (tokens stay server-side, the cookie only carries the session id)
    lua_shared_dict sessions          20m;
    # Basic credentials already checked, keyed by a hash of user and password
    lua_shared_dict basic_auth        10m;
    # Refused tokens in the address and Basic passwords on the tokens API, per client address (link.lua, pat.lua)
    lua_shared_dict link_failures     1m;

    init_by_lua_block {
        require("emondrian.gateway").init()
    }

    # X-Accel-Buffering for a proxy in front: "no" on MCP (SSE), absent elsewhere
    map $uri $mcp_accel_buffering {
        ~^/emondrian/mcp  no;
        default           "";
    }

    # X-Forwarded-Client: "mcp" on the MCP endpoint (streamable HTTP and SSE), so that eMondrian
    # can tell an AI agent from a person; absent elsewhere. Whatever the client sent is dropped.
    map $uri $auth_client {
        ~^/emondrian/mcp(/|$)  mcp;
        default                "";
    }

    # X-Forwarded-Secret: the secret eMondrian checks before it believes the X-Forwarded-* identity
    # headers, on the paths the entry page sends to eMondrian (XML/A, the REST API, the logs page,
    # MCP) and to the Dashboard, which answers nothing without it; never to the web tools. Empty
    # elsewhere, which drops whatever a client sent. $forwarded_secret_value: emondrian-locations.conf.
    map $uri $forwarded_secret {
        ~^/(xmla|api|logs|emondrian/mcp|dashboard)(/|$)  $forwarded_secret_value;
        default                                          "";
    }

    # Strict-Transport-Security on HTTPS only (emondrian-locations.conf)
    map $scheme $hsts {
        https    "max-age=31536000";
        default  "";
    }

    # Cache-Control of the pages behind the login (location / in emondrian-locations.conf):
    # no-store, except fonts, images and content-hashed scripts and styles (a name such as
    # index-3f9a1c2e.js changes with its content), which keep what their server sends.
    map $uri $page_cache_control {
        "~*\.(woff2?|ttf|otf|eot|png|jpe?g|gif|svg|ico|webp)$"            $upstream_http_cache_control;
        "~[-.](?=[A-Za-z0-9_]*[0-9])[A-Za-z0-9_]{8,}\.(m?js|css)$"         $upstream_http_cache_control;
        default                                                            "no-store";
    }

    # GATEWAY_REAL_IP_FROM: the client address from X-Forwarded-For of the proxies named there
    include /etc/nginx/generated/real-ip.conf;
    include /etc/nginx/generated/servers.conf;
}
