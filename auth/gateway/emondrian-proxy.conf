# Proxy settings towards the eMondrian entry container (included by emondrian-locations.conf)
proxy_set_header Host               $http_host;
proxy_set_header X-Real-IP          $remote_addr;
proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto  $scheme;
proxy_set_header X-Forwarded-User   $auth_user;
proxy_set_header X-Forwarded-Groups $auth_groups;
proxy_set_header X-Forwarded-Client $auth_client;
proxy_set_header X-Forwarded-Access-Token $auth_access_token;
# The gateway's secret on eMondrian's paths only (nginx.conf, map $forwarded_secret); never logged
proxy_set_header X-Forwarded-Secret $forwarded_secret;

proxy_connect_timeout 300s;
