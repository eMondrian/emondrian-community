# Locations of the auth gateway, included by the HTTP or HTTPS server block (docker-entrypoint.sh).

absolute_redirect off;
client_max_body_size 100m;

# Filled in by the access phase; an empty value drops the header, so a client-sent
# X-Forwarded-User / X-Forwarded-Groups never reaches eMondrian.
set $auth_user   "";
set $auth_groups "";
set $auth_method "";
# Basic in a 401 when Kerberos is on (second WWW-Authenticate, after Lua's Negotiate)
set $auth_second_challenge "";

# Keycloak (mode broker): login pages, token endpoint. Not authenticated here. The address is
# resolved per request, so that the gateway also starts without Keycloak (mode oidc-direct).
set $keycloak http://keycloak:8080;

location /auth/ {
    proxy_pass $keycloak;
    include /etc/nginx/keycloak-proxy.conf;
}

# Keycloak's admin console and admin API, and the master realm it logs in to: KEYCLOAK_ADMIN_ALLOW only
location ~ ^/auth/(admin|realms/master)(/|$) {
    include /etc/nginx/generated/admin-access.conf;
    proxy_pass $keycloak;
    include /etc/nginx/keycloak-proxy.conf;
}

# APIs: XML/A (Excel, Power BI, OLAP client), REST API of the editors, MCP.
# Bearer token, Basic credentials or the browser session; 401 instead of a redirect.
location ~ ^/(xmla|api|emondrian/mcp)(/|$) {
    access_by_lua_block {
        require("emondrian.gateway").api()
    }
    proxy_pass http://emondrian_entry:80;
    include /etc/nginx/emondrian-proxy.conf;
    add_header WWW-Authenticate $auth_second_challenge always;
    # A proxy in front (nginx/openresty) must not buffer the SSE stream either; MCP only, so that
    # large XML/A answers stay buffered there
    add_header X-Accel-Buffering $mcp_accel_buffering always;

    # MCP over SSE: the stream must not be buffered
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;

    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;
    send_timeout          3600s;
}

# OAuth for MCP clients: Protected Resource Metadata of the MCP endpoint, and Keycloak's
# authorization server metadata at the paths RFC 8414 / OpenID clients derive from its issuer
location ^~ /.well-known/oauth-protected-resource {
    content_by_lua_block {
        require("emondrian.mcp").protected_resource_metadata()
    }
}

location ~ ^/\.well-known/(oauth-authorization-server|openid-configuration)(/auth/realms/[a-z0-9-]+)$ {
    proxy_pass $keycloak$2/.well-known/$1;
    include /etc/nginx/keycloak-proxy.conf;
    add_header Access-Control-Allow-Origin "*" always;
}

# Personal access tokens: the page (browser login) and its API, which auth-tokens serves for
# the session's user
location = /account/tokens {
    access_by_lua_block {
        require("emondrian.gateway").web()
    }
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
    alias /etc/nginx/html/tokens.html;
}

location ~ ^/account/api(/tokens(/[0-9]+)?)$ {
    access_by_lua_block {
        require("emondrian.pat").api()
    }
    proxy_pass http://auth-tokens:8080$1$is_args$args;
    proxy_set_header Host auth-tokens;
    add_header Cache-Control "no-store" always;
}

# Everything else (entry page, OLAP client, editors, logs) plus /redirect_uri and /logout,
# which lua-resty-openidc handles itself: browser login through Keycloak.
location / {
    access_by_lua_block {
        require("emondrian.gateway").web()
    }
    proxy_pass http://emondrian_entry:80;
    include /etc/nginx/emondrian-proxy.conf;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}
