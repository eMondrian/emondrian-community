# Who may log in to eMondrian and where their groups come from. See auth/README.md.
#
# setup.sh / windows-setup.ps1 write auth/identity.yml on the first run (users kept in Keycloak,
# authentication off). Adapt it from the examples below, then apply it with
# auth/scripts/apply-config.sh (no restart) and test a user with auth/scripts/check-config.sh <user>.
# Secrets are never written here: files named here are read from auth/secrets/.

# Where users come from. Both kinds may be listed together.
sources:

  # Users kept in Keycloak itself. Listed users are created once, with a temporary password that
  # must be changed at the first login (in the browser); add further users and change groups in
  # Keycloak's admin console (PUBLIC_URL/auth/admin/, realm "emondrian").
  - name: local
    type: local
    groups: [emondrian-admins, emondrian-editors, emondrian-viewers]
    users:
      - username: admin
        groups: [emondrian-admins]
        initial_password_file: initial-admin-password   # or initial_password: "0"

  # Active Directory or another LDAP directory. Users are looked up at every login and never
  # copied into Keycloak; their passwords are checked by the directory.
  #- name: corp-ad                 # unique
  #  type: ldap
  #  preset: active-directory      # active-directory | openldap
  #  url: ldaps://dc01.corp.example.com:636        # ldaps:// or ldap:// with start_tls: true
  #  bind_dn: CN=svc_emondrian,OU=Service Accounts,DC=corp,DC=example,DC=com
  #  bind_password_file: ad-bind-password          # file in auth/secrets/
  #  users_dn: OU=Users,DC=corp,DC=example,DC=com  # searched with all its sub-OUs
  #  groups_dn: OU=Groups,DC=corp,DC=example,DC=com
  #  # Only members of these groups (directly or through nested groups) may log in. Leave out
  #  # to let every enabled user in users_dn log in.
  #  allowed_groups: [BI-Users, BI-Admins]
  #  # Extra LDAP filter on users, ANDed with the above (optional)
  #  #user_filter: (department=Finance)
  #  # Log in with the user principal name (jdoe@corp.example.com) instead of sAMAccountName
  #  #attributes:
  #  #  username_attribute: userPrincipalName
  #  # The LDAPS certificate must be signed by a CA in auth/secrets/truststore/ (PEM files).

  # An external identity provider (OIDC or SAML): a button on the login page. Presets for OIDC:
  # entra, google, okta, adfs, keycloak, generic; for SAML: adfs, generic.
  #- name: entra                   # unique
  #  type: oidc
  #  preset: entra
  #  display_name: Microsoft
  #  issuer: https://login.microsoftonline.com/<tenant id>/v2.0
  #  client_id: <application id>
  #  client_secret_file: entra-secret              # file in auth/secrets/
  #  # Register both addresses with the provider (here for name: entra): the redirect URI
  #  # PUBLIC_URL/auth/realms/emondrian/broker/entra/endpoint and, for logging out, the post-logout
  #  # redirect URI PUBLIC_URL/auth/realms/emondrian/broker/entra/endpoint/logout_response.
  #  # Without the second, the provider refuses the logout and the person stays signed in.
  #  # Every user must already have an account in Keycloak: signing in through the provider
  #  # never creates one, and somebody without one is refused. true: the sign-in is linked to
  #  # the account with the same e-mail address (or user name), for a provider you trust to
  #  # verify e-mail addresses (your own tenant, not "any Google account"). false (the default):
  #  # only accounts an administrator linked to the provider in Keycloak's admin console
  #  # (Users -> the user -> Identity provider links).
  #  link_by_email: true
  #  # The provider's groups (groups_claim / SAML groups_attribute) go to eMondrian under the
  #  # source's name: /entra/BI-Users (a "/" or "," in a group name is written %2F, %2C), so a
  #  # provider can never grant a Keycloak or server group. A personal token gets them as of the
  #  # user's last login through the provider.

# Every user who logs in gets in. Groups go to eMondrian by full path (X-Forwarded-Groups), and
# eMondrian decides what each user may see and do: server rights per group in
# auth/security/security.properties, data roles per group or user in the schemas
# (<RoleMember name="/Sales-EMEA"/>).

# Authentication off: everybody who reaches the server gets in without logging in (browser,
# Excel, Power BI, MCP), as this one user in these groups. The sources above stay configured.
# Switch with auth/scripts/authentication.sh on|off (Windows: authentication.ps1), no restart.
open_access:
  enabled: true
  user: guest
  groups: [emondrian-admins]

# XML/A links: <PUBLIC_URL>/xmla?emondrian_token=…, a personal address for Power BI Desktop's live
# connection, which sends no saved password; the same token also opens a dashboard in a browser
# (<PUBLIC_URL>/dashboard/d/<id>?emondrian_token=…). One per user; a new one replaces the old.
# Defaults shown.
#xmla_links:
#  enabled: true
#  lifetime: 30d             # 1d to 365d, whole days

# The mail server Keycloak sends its e-mails through: a new user then chooses their own password
# from a link in an e-mail (MCP create_user with send_password_email, or send_password_email).
# Without this section the realm's mail settings are left as they are.
#smtp:
#  host: smtp.example.com
#  port: 587                 # default: 587 for starttls, 465 for ssl, 25 for none
#  security: starttls        # starttls | ssl | none
#  from: bi@example.com
#  from_name: eMondrian      # default
#  reply_to: bi-team@example.com             # optional
#  user: bi@example.com      # user and password_file go together; leave both out for no login
#  password_file: smtp-password              # file in auth/secrets/

# Sessions, lockout, Basic cache. Durations: 45s, 30m, 10h, 2d. Defaults shown.
#policy:
#  password: length(8) and notUsername   # new passwords of users kept in Keycloak
#  session_idle: 30m          # browser session without activity
#  session_max: 10h           # browser session at most
#  lockout:                   # Keycloak blocks a user after failed logins; false: off
#    failures: 5
#    wait: 1m                 # first block, doubled after every further failure...
#    max_wait: 15m            # ...up to this
#  basic_cache: 5m            # a checked login of Excel or Power BI is reused this long, but
#                             # never past 30 s before that login's own token expires (the
#                             # token lifetime, 5m): disabling a user, a new password or a
#                             # removed group reaches Basic within one token lifetime
#  basic_failure_cache: 10s   # a refused login is refused again without asking
