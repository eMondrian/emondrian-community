# The synthetic module's ClickHouse: where synthetic catalogs are generated (syn_* databases).
# No secrets here: the passwords are in .env, read when they are used.
url=http://clickhouse:8123
writer.user=syn_writer
writer.password=${env:EMONDRIAN_SYN_WRITER_PASSWORD}
reader.user=syn_reader
reader.password=${env:EMONDRIAN_SYN_READER_PASSWORD}
