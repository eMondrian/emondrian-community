services:

  eMondrian:
    image: emondrian/emondrian:10.0.44
    container_name: emondrian_service
    volumes:
      - ./logs:/usr/local/tomcat/logs
      - ./datasources.xml:/usr/local/tomcat/webapps/emondrian/WEB-INF/datasources.xml
      #- ./context.xml:/usr/local/tomcat/conf/context.xml   # Volume for Tomcat to update data immediately
      #- ./mondrian.properties:/usr/local/tomcat/webapps/emondrian/WEB-INF/classes/mondrian.properties
      - ./schema:/usr/local/tomcat/webapps/emondrian/WEB-INF/schema
      #- ./clickhouse-jdbc-0.3.2-patch10-all.jar:/usr/local/tomcat/webapps/emondrian/WEB-INF/lib/clickhouse-jdbc-0.3.2-patch10-all.jar
      - ./modules:/usr/local/tomcat/webapps/emondrian/modules
    environment:
      TZ: Europe/Zurich
      # Tomcat defaults to 0027, which makes ./logs unreadable to the host user.
      UMASK: "0022"
      # No emondrian.mcp.connectString here any more: modules 0.0.0.48 removed the only
      # two tools that read it (list-cubes, run-mdx-query), which saw just that one schema
      # -- an agent asking for cubes got FoodMart's and never learned OnTime existed. Every
      # remaining tool (list_catalogs, get_schema, execute_query, ...) reads datasources.xml.
    restart: unless-stopped
    networks:
      - app_network
    depends_on:
      ontime-init:
        condition: service_completed_successfully

  clickhouse:
    image: clickhouse/clickhouse-server:24.3.2.23
    volumes:
      - ./clickhouse/datasets/ontime:/data/ontime
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ""
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  ontime-init:
    image: clickhouse/clickhouse-server:24.3.2.23
    volumes:
      - ./clickhouse/datasets/ontime:/data/ontime:ro
      - ./clickhouse/init-scripts/init-ontime.sh:/init-ontime.sh:ro
    network_mode: "service:clickhouse"
    depends_on:
      clickhouse:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init-ontime.sh"]
    restart: "no"

  olapClient:
    image: emondrian/webolapclient:1.1.0
    container_name: olap_client
    restart: unless-stopped
    networks:
      - app_network

  schemaEditor:
    image: emondrian/schema-editor:1.1.0
    container_name: schema_editor
    restart: unless-stopped
    networks:
      - app_network

  catalogEditor:
    image: emondrian/catalog-editor:1.1.0
    container_name: catalog_editor
    restart: unless-stopped
    networks:
      - app_network

  emondrian_entry:
    image: emondrian/entry:1.3.0
    container_name: emondrian_entry
    restart: unless-stopped
    ports:
      - "${EMONDRIAN_PORT:-80}:80"
    env_file:
      - .env
    environment:
      # The MCP route at /emondrian/mcp/ is on unless .env sets ENABLE_SERVICE_MCP=false.
      ENABLE_SERVICE_MCP: ${ENABLE_SERVICE_MCP:-true}
    networks:
      - app_network
    depends_on:
      - eMondrian
      - olapClient
      - schemaEditor
      - catalogEditor

networks:
  app_network:
    driver: bridge

volumes:
  clickhouse_data:
