services:

  eMondrian:
    image: emondrian/emondrian:10.0.39
    container_name: emondrian_service
    volumes:
      - ./logs:/usr/local/tomcat/logs
      - ./datasources.xml:/usr/local/tomcat/webapps/emondrian/WEB-INF/datasources.xml
      #- ./context.xml:/usr/local/tomcat/conf/context.xml   # Volume for Tomcat to update data immediately
      #- ./mondrian.properties:/usr/local/tomcat/webapps/emondrian/WEB-INF/classes/mondrian.properties
      - ./schema:/usr/local/tomcat/webapps/emondrian/WEB-INF/schema
      #- ./clickhouse-jdbc-0.3.2-patch10-all.jar:/usr/local/tomcat/webapps/emondrian/WEB-INF/lib/clickhouse-jdbc-0.3.2-patch10-all.jar
      - ./modules:/usr/local/tomcat/webapps/emondrian/modules
    environment:
      TZ: Europe/Zurich
      # Tomcat defaults to 0027, which makes ./logs unreadable to the host user.
      UMASK: "0022"
      # The MCP tools list-cubes and run-mdx-query use this one fixed connect string; the
      # catalog-aware tools (list_catalogs, get_schema, execute_query) read datasources.xml
      # instead and need nothing here. Catalog is an absolute path inside the container,
      # because DriverManager has no ServletContext to resolve a /WEB-INF/... path against.
      JAVA_TOOL_OPTIONS: "-Demondrian.mcp.connectString=Provider=mondrian;Jdbc=jdbc:hsqldb:res:/hsqldb-foodmart/foodmart;JdbcDrivers=org.hsqldb.jdbc.JDBCDriver;Catalog=/usr/local/tomcat/webapps/emondrian/WEB-INF/schema/Foodmart.xml"
    restart: unless-stopped
    networks:
      - app_network
    depends_on:
      ontime-init:
        condition: service_completed_successfully

  clickhouse:
    image: clickhouse/clickhouse-server:24.3.2.23
    volumes:
      - ./clickhouse/datasets/ontime:/data/ontime
      - clickhouse_data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ""
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  ontime-init:
    image: clickhouse/clickhouse-server:24.3.2.23
    volumes:
      - ./clickhouse/datasets/ontime:/data/ontime:ro
      - ./clickhouse/init-scripts/init-ontime.sh:/init-ontime.sh:ro
    network_mode: "service:clickhouse"
    depends_on:
      clickhouse:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init-ontime.sh"]
    restart: "no"

  olapClient:
    image: emondrian/webolapclient:1.0
    container_name: olap_client
    networks:
      - app_network

  schemaEditor:
    image: emondrian/schema-editor:1.0
    container_name: schema_editor
    networks:
      - app_network

  catalogEditor:
    image: emondrian/catalog-editor:1.0
    container_name: catalog_editor
    networks:
      - app_network

  emondrian_entry:
    image: emondrian/entry:1.0
    container_name: emondrian_entry
    ports:
      - "${EMONDRIAN_PORT:-80}:80"
    env_file:
      - .env
    environment:
      # The MCP route at /emondrian/mcp/ is on unless .env sets ENABLE_SERVICE_MCP=false.
      ENABLE_SERVICE_MCP: ${ENABLE_SERVICE_MCP:-true}
    networks:
      - app_network
    depends_on:
      - eMondrian
      - olapClient
      - schemaEditor
      - catalogEditor

networks:
  app_network:
    driver: bridge

volumes:
  clickhouse_data:
