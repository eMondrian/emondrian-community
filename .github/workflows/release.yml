# Publishes a GitHub Release when a date tag (2026.10.18 or 2026.10.18.1) is pushed, with the
# matching section of CHANGELOG.md as its notes.
name: Release

on:
  push:
    tags:
      - '20[0-9][0-9].[0-9][0-9].[0-9][0-9]'
      - '20[0-9][0-9].[0-9][0-9].[0-9][0-9].[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notes from CHANGELOG.md
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            $0 == "## " tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section '## $GITHUB_REF_NAME'" >&2
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$GITHUB_REF_NAME: $(grep -m1 '^Server ' notes.md | tr -d '`')"
          gh release create "$GITHUB_REF_NAME" --title "$title" --notes-file notes.md --verify-tag
